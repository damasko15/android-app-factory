name: Release

# Se ejecuta a mano desde la app de GitHub: Actions -> Release -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar, ej. v1.0.0 (debe coincidir con app/app.json)"
        required: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Compilar APK
        working-directory: app/android
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/android/app/build/outputs/apk/release/*.apk

  publish:
    needs: build
    # PUERTA 3: configura el environment "production" con "Required reviewers" (tú).
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist
      - name: Renombrar APK
        run: mv dist/*.apk "dist/app-${{ inputs.version }}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.version }}
          generate_release_notes: true
          files: dist/app-${{ inputs.version }}.apk
